name: plugin branch (refill)

# The `plugin` branch is written by job `plugin-branch` in release.yml after a tag passes every release check.
# This workflow only refills it by hand from an existing release tag (for example after the branch was deleted):
# it checks out that tag, runs the tag checks again, and writes the same built plugin. It never publishes main.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "existing release tag, e.g. v1.0.0"
        required: true

permissions:
  contents: write

concurrency:
  group: plugin-branch
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: the tag has a GitHub Release (only released versions reach the plugin branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" > /dev/null
      - name: plugin checks for this tag
        run: python3 scripts/build_plugin.py --check --tag "${{ inputs.tag }}"
      - name: build the plugin
        run: python3 scripts/build_plugin.py
      - name: validate the built plugin with the Claude Code CLI
        run: npx -y @anthropic-ai/claude-code@2.1.318 plugin validate dist/gamesmith/.claude-plugin/plugin.json
      - name: commit the built plugin to the plugin branch
        run: scripts/publish_plugin_branch.sh dist/gamesmith plugin
